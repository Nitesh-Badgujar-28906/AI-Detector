services:
  # Single Flask Service (serves API + React frontend)
  - type: web
    name: ai-detector
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
    healthCheckPath: /api/health

